services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "27022:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: juice-erp

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5006:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/juice-erp
      - JWT_SECRET=juice_erp_enterprise_jwt_secret_key_2026_super_secure_token
      - JWT_REFRESH_SECRET=juice_erp_enterprise_jwt_refresh_key_2026_super_secure_token

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8082:80"

volumes:
  mongo-data:
